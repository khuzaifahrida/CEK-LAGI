const V=(()=>{const t=new Date().toISOString().slice(0,10);let v=ld('vis',{t,h:0,all:1233});if(v.t!==t){v.t=t;v.h=0}v.h++;v.all++;sv('vis',v);return v})();
const card='rounded-2xl border border-slate-200 bg-white p-5 shadow-sm',btn='inline-flex items-center gap-2 rounded-xl px-5 py-2.5 text-sm font-semibold transition hover:opacity-90',inp='w-full rounded-xl border border-slate-300 bg-white px-3 py-2 text-sm outline-none focus:border-brand';
const h2=(t,s='')=>`<h2 class="text-2xl font-bold text-navy md:text-3xl">${t}</h2>${s?`<p class="mt-1 text-black">${s}</p>`:''}`;
const sec=h=>`<section class="mx-auto max-w-6xl px-4 py-10">${h}</section>`;
const nOPD=()=>new Set(DATA.map(x=>x.o)).size,byG=()=>{const c={};DATA.forEach(x=>c[x.g]=(c[x.g]||0)+1);return Object.entries(c).sort((a,b)=>b[1]-a[1])};
const bars=r=>`<div class="space-y-3">${r.map(([n,v],_,a)=>`<div><div class="flex justify-between text-xs"><span>${esc(n)}</span><b>${v}</b></div><div class="h-2 rounded-full bg-slate-100"><div class="h-2 rounded-full bg-gradient-to-r from-brand to-leaf" style="width:${v/Math.max(1,...a.map(z=>z[1]))*100}%"></div></div></div>`).join('')||'<p class="text-sm text-black">Belum ada data.</p>'}</div>`;
const top=n=>[...DATA].sort((a,b)=>score(b)-score(a)).slice(0,n);
const sc=s=>`<span class="rounded-lg px-2 py-0.5 text-sm font-bold ${s>=75?'bg-green-100 text-green-700':s>=60?'bg-amber-100 text-amber-700':'bg-slate-100 text-black'}">${s}</span>`;
const misi=g=>{const n=mi(g);return n?`<span class="rounded bg-navy px-2 py-0.5 text-xs font-semibold text-white">Misi ${n} ${MIS[n-1][0]}</span>`:'–'};
const pilar=g=>{const n=mi(g);return n?MIS[n-1][2].map(p=>`<span class="rounded-full bg-blue-50 px-2 py-0.5 text-[11px] font-semibold text-navy" title="${PIL[p-1]}">Pilar ${p}</span>`).join(' '):''};
function trend(){const now=new Date(),a=[];for(let y=2025;y<=now.getFullYear();y++)for(let m=1;m<=12;m++)if(y<now.getFullYear()||m<=now.getMonth()+1)a.push([y,m]);
 const c=a.map(([y,m])=>DATA.filter(x=>x.y==y&&x.m==m).length),mx=Math.max(2,...c),X=i=>34+i*(650/Math.max(1,a.length-1)),Y=v=>170-v/mx*140,p=c.map((v,i)=>`${X(i)},${Y(v)}`).join(' ');
 return `<svg viewBox="0 0 700 210" class="w-full">${[0,1,2,3].map(i=>`<line x1="34" x2="684" y1="${30+i*46.7}" y2="${30+i*46.7}" stroke="#e2e8f0"/>`).join('')}<text x="2" y="34" font-size="10" fill="#000">${mx}</text><text x="2" y="174" font-size="10" fill="#000">0</text><polygon points="34,170 ${p} 684,170" fill="#2b8ad0" opacity=".12"/><polyline points="${p}" fill="none" stroke="#0f3a6b" stroke-width="2.5"/>${c.map((v,i)=>`<circle cx="${X(i)}" cy="${Y(v)}" r="3.5" fill="#f5b61b" stroke="#0f3a6b"><title>${a[i][1]}/${a[i][0]}: ${v} usulan</title></circle>${i%3==0?`<text x="${X(i)}" y="195" font-size="10" text-anchor="middle" fill="#000">${a[i][1]}/${String(a[i][0]).slice(2)}</text>`:''}`).join('')}</svg>`}

doLogin(){if($('#pw').value===PASS){ADM=true;sv('adm',1);modal('');render(1)}else{$('#pw').value='';$('#pw').placeholder='Salah, coba lagi'}},
logout(){ADM=false;sv('adm',0);render(1)},close(){modal('')},
edit(id){const x=DATA.find(d=>d.id==id);modal(`<h3 class="mb-3 text-lg font-bold text-navy">Edit Usulan</h3><div class="space-y-3"><input id="e_o" class="${inp}" value="${esc(x.o)}"><textarea id="e_i" rows="2" class="${inp}">${esc(x.i)}</textarea><select id="e_g" class="${inp}">${KEL.map(k=>`<option ${x.g==k?'selected':''}>${k}</option>`).join('')}</select><label class="text-xs">Tahun<input id="e_y" type="number" value="${x.y}" class="${inp}"></label><div class="grid grid-cols-2 gap-2">${Object.keys(W).map(k=>`<label class="text-xs">${WL[k]} (bobot ${W[k]})<input id="e_${k}" type="number" min="0" max="100" value="${x[k]}" class="${inp}"></label>`).join('')}</div></div><div class="mt-4 flex gap-2"><button data-a="saveEdit" data-v="${id}" class="${btn} bg-navy text-white">Simpan</button><button data-a="close" class="${btn} border">Batal</button></div>`)},

mitra(){const n=$('#m_n').value.trim(),u=$('#m_u').value.trim(),g=s=>[...document.querySelectorAll(`[name=${s}]:checked`)].map(e=>e.value);if(!n||!u)return note('Nama lembaga dan uraian rencana intervensi wajib diisi.');MIT.push({n,j:$('#m_j').value,k:g('kb'),o:g('dk'),m:+$('#m_m').value});sv('mit',MIT);render(1);note('Permohonan terkirim dan masuk ke analisis. Bapperida akan memverifikasi.')},
fbo(){sync();FB.o=!FB.o;fb()},fbx(){FB.o=false;fb()},rate(v){sync();FB.r=+v;fb()},chip(v){sync();FB.c=FB.c.includes(v)?FB.c.filter(c=>c!=v):[...FB.c,v];fb()},
fbs(){sync();const l=ld('fb',[]);l.push({...FB,d:Date.now()});sv('fb',l);FB={o:false,r:0,c:[],a:'',t:''};fb();note('Terima kasih atas masukan Anda!')}};
document.addEventListener('click',e=>{const a=e.target.closest('[data-a]');if(a&&!a.disabled)act[a.dataset.a]?.(a.dataset.v)});

addEventListener('hashchange',()=>render());
render();fb();
const FSHEET='1DsbCO4RVjS1LsmbaNUHoYuWFPgTRhndLrGjEnXAs4Jc';
const csvp=t=>{const R=[];let r=[],c='',q=false;for(let i=0;i<t.length;i++){const h=t[i];if(q){if(h=='"'){if(t[i+1]=='"'){c+='"';i++}else q=false}else c+=h}else if(h=='"')q=true;else if(h==','){r.push(c);c=''}else if(h=='\n'||h=='\r'){if(h=='\r'&&t[i+1]=='\n')i++;r.push(c);R.push(r);r=[];c=''}else c+=h}if(c||r.length){r.push(c);R.push(r)}return R};
const gs=async id=>{const r=await fetch(`https://docs.google.com/spreadsheets/d/${id}/gviz/tq?tqx=out:csv`);if(!r.ok)throw 0;return csvp(await r.text())};
const idx=(h,re,ex=-1)=>h.findIndex((c,i)=>i!=ex&&re.test(c)),SENS=/e-?mail|surel|telepon|telp|\bhp\b|whatsapp|\bwa\b|\bnip\b/i;

return{id:n+1,y:isNaN(d)?(mt?+mt[0]:new Date().getFullYear()):d.getFullYear(),m:isNaN(d)?1:d.getMonth()+1,o:c[io]||'-',g:ig>=0&&c[ig]?c[ig]:'Lainnya',i:c[ii]||'-',out:iu>=0?c[iu]:'',p:ip>=0?c[ip]:'',u:g('u'),r:g('r'),j:g('j'),d:g('d'),a:g('a'),raw,...(OV[n+1]||{})}});
KEL=[...new Set(DATA.map(x=>x.g))].sort();LIVE=true;ST='ok'}catch(e){ST='err'}
